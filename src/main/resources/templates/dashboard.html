<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Bienvenido al Dashboard</h1>
        <p id="usuario">Cargando usuario...</p>
        <button id="logoutBtn" class="btn btn-danger mt-3">Cerrar sesión</button>
    </div>

    <script>
        // 🔹 Tomar JWT del localStorage
        console.log("Token recibido:", localStorage.getItem('jwt'));
        const token = localStorage.getItem('jwt');

        if(!token){
            window.location.href = '/login';
        } else {
            fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(res => {
                if(!res.ok) throw new Error("Token inválido");
                return res.json();
            })
            .then(data => {
                document.getElementById('usuario').innerText = 'Hola ' + data.username;
            })
            .catch(err => {
                console.error(err);
                localStorage.removeItem('jwt');
                window.location.href = '/login';
            });
        }

        // 🔹 Botón de logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('jwt');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
